name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/dreamy-dirac-wyt7lp]
  workflow_dispatch:

# Only needs permission to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site to gh-pages branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .nojekyll keeps GitHub Pages from ignoring files/folders.
          touch .nojekyll
          git checkout --orphan gh-pages
          git reset
          git add -f index.html styles.css script.js images .nojekyll
          git commit -m "Deploy site to GitHub Pages"
          git push -f origin gh-pages
